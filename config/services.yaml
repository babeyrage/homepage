---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

# - Schedule:
#     - Dota 2:
#         href: https://www.dota2.com
#         widget:
#             type: dota2
#             key: "{{HOMEPAGE_VAR_PANDASCORE_API_KEY}}"

- Media:
    - Plex:
        icon: plex.svg
        href: http://{{HOMEPAGE_VAR_PLEX_URL}}:{{HOMEPAGE_VAR_PLEX_PORT}}/web
        widget:
            type: plex
            url: http://{{HOMEPAGE_VAR_PLEX_URL}}:{{HOMEPAGE_VAR_PLEX_PORT}}
            key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"

    - Radarr:
        icon: radarr.svg
        href: http://{{HOMEPAGE_VAR_RADARR_URL}}:{{HOMEPAGE_VAR_RADARR_PORT}}
        widget:
            type: radarr
            url: http://{{HOMEPAGE_VAR_RADARR_URL}}:{{HOMEPAGE_VAR_RADARR_PORT}}
            key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
            enableQueue: true

    - Sonarr:
        icon: sonarr.svg
        href: http://{{HOMEPAGE_VAR_SONARR_URL}}:{{HOMEPAGE_VAR_SONARR_PORT}}
        widget:
            type: sonarr
            url: http://{{HOMEPAGE_VAR_SONARR_URL}}:{{HOMEPAGE_VAR_SONARR_PORT}}
            key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
            enableQueue: true

    - Seerr:
        icon: seerr.svg
        href: http://{{HOMEPAGE_VAR_SEERR_URL}}:{{HOMEPAGE_VAR_SEERR_PORT}}
        widget:
            type: jellyseerr
            url: http://{{HOMEPAGE_VAR_SEERR_URL}}:{{HOMEPAGE_VAR_SEERR_PORT}}
            key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"

    - Tautulli:
        icon: tautulli.svg
        href: http://{{HOMEPAGE_VAR_PLEX_URL}}:{{HOMEPAGE_VAR_PLEX_PORT}}
        widget:
            type: tautulli
            url: http://{{HOMEPAGE_VAR_TAUTULLI_URL}}:{{HOMEPAGE_VAR_TAUTULLI_PORT}}
            key: "{{HOMEPAGE_VAR_TAUTULLI_API_KEY}}"
            enableUser: true
            showEpisodeNumber: true
            expandOneStreamToTwoRows: true

- Downloads:
    - QBittorrent:
        icon: qbittorrent.svg
        href: http://{{HOMEPAGE_VAR_QBIT_URL}}:{{HOMEPAGE_VAR_QBIT_PORT}}
        widget:
            type: qbittorrent
            url: http://{{HOMEPAGE_VAR_QBIT_URL}}:{{HOMEPAGE_VAR_QBIT_PORT}}
            username: "{{HOMEPAGE_VAR_QBIT_USER}}"
            password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
            enableLeechProgress: true
            enableLeechSize: true

    - SABnzbd:
        icon: sabnzbd.svg
        href: http://{{HOMEPAGE_VAR_SABZNDB_URL}}:{{HOMEPAGE_VAR_SABZNDB_PORT}}
        widget:
            type: sabnzbd
            url: http://{{HOMEPAGE_VAR_SABZNDB_URL}}:{{HOMEPAGE_VAR_SABZNDB_PORT}}
            key: "{{HOMEPAGE_VAR_SABZNDB_API_KEY}}"

- Network:
    - Speedtest Tracker:
        icon: speedtest-tracker.png
        href: http://{{HOMEPAGE_VAR_SPEEDTEST_URL}}:{{HOMEPAGE_VAR_SPEEDTEST_PORT}}
        widget:
            type: speedtest
            url: http://{{HOMEPAGE_VAR_SPEEDTEST_URL}}:{{HOMEPAGE_VAR_SPEEDTEST_PORT}}
            version: 2
            key: "{{HOMEPAGE_VAR_SPEEDTEST_API_KEY}}"
            bitratePrecision: 3

    - Traefik:
        icon: traefik.svg
        href: http://{{HOMEPAGE_VAR_TRAEFIK_URL}}:{{HOMEPAGE_VAR_TRAEFIK_PORT}}
        widget:
            type: traefik
            url: http://{{HOMEPAGE_VAR_TRAEFIK_URL}}:{{HOMEPAGE_VAR_TRAEFIK_PORT}}
            # username: "{{HOMEPAGE_VAR_TRAEFIK_USER}}"
            # password: "{{HOMEPAGE_VAR_TRAEFIK_PASSWORD}}"

    - UniFi:
        icon: unifi.svg
        href: http://{{HOMEPAGE_VAR_UNIFI_URL}}:{{HOMEPAGE_VAR_UNIFI_PORT}}
        widget:
            type: unifi
            url: https://{{HOMEPAGE_VAR_UNIFI_URL}}:{{HOMEPAGE_VAR_UNIFI_PORT}}
            site: Site Name
            key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"

    - EdgeSwitch:
        icon: ubiquiti.svg
        href: https://{{HOMEPAGE_VAR_SWITCH_URL}}:{{HOMEPAGE_VAR_SWITCH_PORT}}

- Monitoring:
    - Pulse:
        icon: pulse.svg
        href: http://{{HOMEPAGE_VAR_PULSE_URL}}:{{HOMEPAGE_VAR_PULSE_PORT}}

    - Patchmon:
        icon: patchmon.svg
        href: http://{{HOMEPAGE_VAR_PATCHMON_URL}}:{{HOMEPAGE_VAR_PATCHMON_PORT}}

    - Domain Monitor:
        icon:
        href: http://{{HOMEPAGE_VAR_DOMAINS_URL}}:{{HOMEPAGE_VAR_DOMAINS_PORT}}

- Security:
    - Crowdsec:
        icon: crowdsec.svg
        href: https://app.crowdsec.net/

    - OPNsense:
        icon: opnsense.svg
        href: http://{{HOMEPAGE_VAR_OPNSENSE_URL}}:{{HOMEPAGE_VAR_OPNSENSE_PORT}}

    - Wazuh:
        icon: wazuh.svg
        href: https://{{HOMEPAGE_VAR_WAZUH_URL}}:{{HOMEPAGE_VAR_WAZUH_PORT}}