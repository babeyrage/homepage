---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- SECURITY INFO:
    - NVD CVEs:
        href: https://nvd.nist.gov/vuln/search#/nvd/home?resultType=records
        widget:
            type: nvd
    
    - CISA KEV:
        widget:
            type: cisa

    - Calendar:
        widget:
            type: calendar
            firstDayInWeek: monday
            view: monthly
            maxEvents: 10
            showTime: true
            timezone: Australia/Perth
            integrations:
                - type: ical 
                  url: https://outlook.office365.com/owa/calendar/cf79f7b88baf4c8987bba3da31c59a8b@esngroup.com.au/983fb84d0b7046cbacbf7c71e801779b2518182617876278773/calendar.ics
                  name: Work
                  color: amber

- NEWS:
    - Security News:
        widget:
            type: iframe
            src: http://{{HOMEPAGE_VAR_GLANCE_URL}}:{{HOMEPAGE_VAR_GLANCE_PORT}}
            classes: glance
            loadingStrategy: lazy
            referrerPolicy: same-origin
            allowPolicy: fullscreen

- INFO:
    - MEDIA-INFO: 
        - Plex:
            icon: plex.svg
            href: http://{{HOMEPAGE_VAR_PLEX_URL}}:{{HOMEPAGE_VAR_PLEX_PORT}}/web
            proxmoxNode: "{{HOMEPAGE_VAR_PROXMOX_NODE_1}}"
            proxmoxVMID: "{{HOMEPAGE_VAR_PLEX_VMID}}"
            proxmoxType: lxc
            widget:
                type: plexrecent
                url: http://{{HOMEPAGE_VAR_PLEX_URL}}:{{HOMEPAGE_VAR_PLEX_PORT}}
                key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
                enableImageProxy: true

        - Upcoming Releases:
            icon: notion-calendar.svg
            widget:
                type: calendar
                view: agenda
                maxEvents: 10
                showTime: true
                timezone: Australia/Perth
                integrations:
                    - type: sonarr
                      service_group: ARR STACK
                      service_name: Sonarr
                      color: teal
                    - type: radarr
                      service_group: ARR STACK
                      service_name: Radarr
                      color: amber
    
    - DOTA 2:
        - Dota 2: 
            href: https://www.dota2.com
            widget:
                type: dota2
                key: "{{HOMEPAGE_VAR_PANDASCORE_API_KEY}}"

