---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

###### GLOBAL SETTINGS ######
fullWidth: true
fiveColumns: true
useEqualHeights: true
theme: dark
cardBlur: xl
headerStyle: clean
target: _self

###### LAYOUT SETTINGS ######
layout:
  SIGNAL:
    tab: HOMELAB
    style: row
    columns: 3
    useEqualHeights: true

    DOTA 2:
      header: false
      style: row
      columns: 1
    PLEX:
      header: false
      style: row
      columns: 1
    UPCOMING RELEASES:
      header: false
      style: row
      columns: 1

  MEDIA:
    tab: HOMELAB
    style: row
    columns: 4

  INFRASTRUCTURE:
    tab: HOMELAB
    style: row
    columns: 2

    COMPUTE:
      tab: HOMELAB
      style: column
    BACKUPS:
      tab: HOMELAB
      style: column

  HOME NETWORK:
    tab: HOMELAB
    style: row
    columns: 4
    useEqualHeights: true
    
    DOWNLOADS:
      tab: HOMELAB
      style: column

    NETWORK:
      tab: HOMELAB
      style: column

    MONITORING:
      tab: HOMELAB
      style: column

  SECURITY INFO:
    tab: WORK
    header: false
    style: row
    columns: 3
  
  NEWS:
    tab: WORK
    header: false
    style: row
    columns: 1

###### BOOKMARKS ######
### HOMELAB ###
  DEVELOPER:
    tab: HOMELAB
  ENTERTAINMENT:
    tab: HOMELAB

### WORK ###
  ESN:
    tab: WORK
  M365:
    tab: WORK
  CONNECTWISE:
    tab: WORK
  CYBER:
    tab: WORK
  DOMAINS/DNS:
    tab: WORK
  OSINT:
    tab: WORK

providers:
  finnhub: {{HOMEPAGE_VAR_FINNHUB_TOKEN}}
  # openweathermap: {{HOMEPAGE_VAR_OPENWEATHERMAP_TOKEN}}

# favicon: icons/arrows.ico

